<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BIO 005 Human Physiology">
  <title>BIO 005 Human Physiology</title>
  <!--
    THE COURSE FAVICON. Rebuilt Sep 16 2026, second pass.

    This is her mark, the blocky one: three circle heads over three rounded
    rectangle bodies, authored at viewBox 0 0 34 34 in the shared brand bar.
    The favicon used to draw the other figure, the one with the flowing body,
    which was never her logo. Every page in the course now draws this one.

    Order of record: navy, maroon, gold, left to right, third figure GOLD.

    On the navy tile the navy figure would disappear, so white stands in for
    it, and the maroon is lifted to #C06A58 so it still reads at 16px. True
    maroon #8B3A2E on navy is 2.36:1, invisible at that size. The lifted
    maroon is 4.68:1 and the gold is 7.46:1.

    The transform maps her 34 by 34 artwork onto the tile: her drawn area runs
    x 3.8 to 30.2 and y 3.8 to 29, scaled 12.88 times and centered.
  -->
  <rect width="512" height="512" rx="96" fill="#0B1530"/>
  <g transform="translate(37.1,44.8) scale(12.88)">
    <circle cx="8" cy="8" r="4.2" fill="#FFFFFF"/>
    <circle cx="17" cy="8" r="4.2" fill="#C06A58"/>
    <circle cx="26" cy="8" r="4.2" fill="#C9A14A"/>
    <rect x="5.5" y="15" width="5" height="14" rx="2.5" fill="#FFFFFF"/>
    <rect x="14.5" y="15" width="5" height="14" rx="2.5" fill="#C06A58"/>
    <rect x="23.5" y="15" width="5" height="14" rx="2.5" fill="#C9A14A"/>
  </g>
</svg>

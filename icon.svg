<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BIO 005 Human Physiology">
  <title>BIO 005 Human Physiology</title>
  <!--
    THE COURSE FAVICON. Rebuilt Sep 16 2026.

    Brand of record: the three figure mark runs navy, maroon, gold left to
    right, and the third figure is GOLD. The old file had it as white, gold,
    terra, so the order was wrong and the third figure was the wrong color.
    It also used #C2734D, the BIO 004 terra, which the physiology palette
    replaced with maroon #8B3A2E.

    On the navy tile the navy figure would disappear, so white stands in for
    it, and the maroon is lifted to #C06A58 so it reads at this size. True
    maroon #8B3A2E on navy is 2.36:1, which is invisible at 16px. The lifted
    maroon is 4.68:1 and the gold is 7.46:1.
  -->
  <rect width="512" height="512" rx="96" fill="#0B1530"/>
  <g transform="translate(64,96) scale(1.9)">
    <g transform="translate(0,18)">
      <g transform="translate(60,0) rotate(8 0 130)">
        <circle cx="0" cy="20" r="10" fill="#FFFFFF"/>
        <path d="M 0,32 C -10,32 -16,36 -16,42 C -16,55 -13,68 -11,82 C -10,100 -12,118 -14,130 L 14,130 C 12,118 10,100 11,82 C 13,68 16,55 16,42 C 16,36 10,32 0,32 Z" fill="#FFFFFF"/>
      </g>
      <g transform="translate(100,0)">
        <circle cx="0" cy="10" r="11" fill="#C06A58"/>
        <path d="M 0,22 C -11,22 -17,26 -17,34 C -17,52 -14,70 -12,86 C -11,108 -13,122 -15,132 L 15,132 C 13,122 11,108 12,86 C 14,70 17,52 17,34 C 17,26 11,22 0,22 Z" fill="#C06A58"/>
      </g>
      <g transform="translate(140,0) rotate(-8 0 130)">
        <circle cx="0" cy="20" r="10" fill="#C9A14A"/>
        <path d="M 0,32 C -10,32 -16,36 -16,42 C -16,55 -13,68 -11,82 C -10,100 -12,118 -14,130 L 14,130 C 12,118 10,100 11,82 C 13,68 16,55 16,42 C 16,36 10,32 0,32 Z" fill="#C9A14A"/>
      </g>
    </g>
  </g>
</svg>

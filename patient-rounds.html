<!--
  ============================================================
  BIO 005 Human Physiology, Fall 2026, Yuba College
  patient-rounds.html

  Sep 22 2026. Scrubs asked for three things and they are one thing.
    1. Chart it on screen, laid out the way a hospital record lays a
       patient out.
    2. Walk them through the case and the charting as they go.
    3. Tell them HOW to chart, never WHAT to chart, and direct by
       asking questions that make them think.

  So this is a stepped case on the left and a live chart on the
  right. Each step moves the patient's story forward, or asks a
  question, or teaches one piece of charting craft. The chart fills
  up as they work and is the thing they hand in.

  THE ORDER MATTERS AND IT IS ENFORCED, TWICE. Step 2 is a
  prediction made before any result is visible. Until it is written,
  the Results and Flowsheet tabs are locked. And the note itself
  opens one part at a time as the steps reach it, so at step 2 there
  is an arc and nothing else: the prediction asks about numbers that
  are not on the screen yet and will not be until the student has
  committed. Jumping down the step rail opens the note as far as the
  step jumped to, so the rail is a shortcut and never a way round.
  That is the same mechanism BIO005-patient-file.html uses and it is
  the reason this assignment survives contact with a chatbot.

  HOW, NOT WHAT. The teaching library near the bottom of the script
  holds twelve charting lessons: filing against a time, charting a
  weight, charting what you did not find, charting an output nobody
  measured, a score charted as its parts, a set value against a
  measured one, a held medication, a calculated number, closing a
  problem, and so on. Each week names one. None of them says what
  value to type.

  TRANSCRIPTION IS CHECKED, NOT SUPPLIED. The student reads the
  numbers out of the note and the results, exactly as a nurse reads
  them off a monitor and a lab report, and types them into an empty
  flowsheet. The app then compares what they typed against
  bio005-chart-ehr.js and says which cells disagree. It never fills a
  cell in. Free text rows, oxygen delivered, pupils, reflexes, are
  marked as not auto-checked rather than being marked wrong for
  wording.

  WEEKS 1 TO 3 ARRIVE ALREADY FILED. Those three weeks were charted on
  paper before this page existed (Sep 27: typed charting starts Week 4) and nobody should do them twice.
  They render filled and read-only with a line saying so.

  NOT AN IMITATION OF ANY VENDOR. Banner, activity tabs, a time
  ordered flowsheet, a medication record and a step list down the
  side are conventions every inpatient record shares. No vendor's
  branding, colors or wording appears anywhere on this page.

  SAVING. Everything typed is kept in localStorage under
  bio005-rounds-v1-wN, and a save code can be copied out and pasted
  back on another machine. Drawings are not saved, which is the other
  reason to export the PDF every week.


  Sep 22 2026, palette. The navy had a green cast that read as teal and
  the accent was a brown sienna. Navy is now #1B2A4A, a dark navy, and
  the accent is #8C2F39, a red maroon, which is also what the design
  system originally called that token. Both were contrast checked before
  they were applied: navy went from 11.49:1 to 14.22:1 on white, and the
  accent from 5.62:1, which clears AA only, to 8.14:1, which clears AAA.
  Every text pair on this page now reaches AAA.

  STANDALONE ON PURPOSE. This sits in a Canvas module as an iframe,
  so the site chrome is off it and the bar at the top is the only way
  off the page.
  ============================================================
-->

<script>
(function () {
'use strict';

var C = window.BIO005_CHART, E = window.BIO005_EHR;
var root = document.getElementById('stepbody');
if (!C || !E || !root) { return; }

/* ---------- which week ---------- */
var m = /[?&]week=(\d{1,2})/.exec(location.search);
var WK = m ? Math.max(1, Math.min(15, parseInt(m[1], 10))) : 1;
var wk = C.weeks[WK], ex = E.weeks[WK];
if (!wk || !ex) {
  root.textContent = 'Week ' + WK + ' is missing from the chart. Tell Dr. Rennie, because that is a mistake and not a design choice.';
  return;
}
var pKey = C.patientByWeek[WK] || 'A';
var P = C.patients[pKey];
var B = E.banner[pKey];
var KEY = 'bio005-rounds-v1-w' + WK;
var TRACKKEY = 'bio005-track-v1';

/* ---------- saved state ---------- */
var S = { v:1, week:WK, answers:{}, flow:{}, io:{}, done:{}, track:null, name:'', seen:-1, log:{}, days:{}, opened:null, exports:[] };
try {
  var raw = localStorage.getItem(KEY);
  if (raw) { var got = JSON.parse(raw); if (got && got.week === WK) { S = Object.assign(S, got); } }
} catch (e) {}
try { if (!S.track) { S.track = localStorage.getItem(TRACKKEY); } } catch (e) {}

/* Sep 27 2026, Scrubs: date every entry. Each field keeps the first time
   something was typed in it and the last time it changed, and the week keeps
   a count of edits per day. All of it prints on the PDF. The times come from
   the student's own computer clock, so they show work pattern, not proof;
   the Canvas upload time is the only server time. */
S.log = S.log || {}; S.days = S.days || {}; S.exports = S.exports || [];
if (!S.opened) { S.opened = new Date().toISOString(); }
function dayKey(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function stamp(id) {
  var d = new Date(), now = d.toISOString();
  var r = S.log[id] || (S.log[id] = { first:now, n:0 });
  r.last = now; r.n++;
  var k = dayKey(d); S.days[k] = (S.days[k] || 0) + 1;
}
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(iso) {
  if (!iso) { return ''; }
  var d = new Date(iso); if (isNaN(d)) { return ''; }
  return MON[d.getMonth()] + ' ' + d.getDate() + ', ' + ('0' + d.getHours()).slice(-2) + ('0' + d.getMinutes()).slice(-2);
}
function fmtDay(k) { var a = k.split('-'); return MON[parseInt(a[1], 10) - 1] + ' ' + parseInt(a[2], 10); }
function stampLine(r) {
  if (!r) { return ''; }
  var t = 'Entered ' + fmt(r.first);
  if (r.last && fmt(r.last) !== fmt(r.first)) { t += '. Last changed ' + fmt(r.last); }
  return '<p class="stamp">' + t + '.</p>';
}
/* one stamp for a group of fields: the earliest first entry and the latest change */
function groupStamp(st, prefix) {
  var first = null, last = null;
  Object.keys(st.log || {}).forEach(function (k) {
    if (k.indexOf(prefix) !== 0) { return; }
    var r = st.log[k];
    if (!first || r.first < first) { first = r.first; }
    if (!last || r.last > last) { last = r.last; }
  });
  return first ? { first:first, last:last } : null;
}
function activityHtml(st) {
  var ks = Object.keys(st.days || {}).sort();
  var h = '<div class="beat activity"><h3>When you worked on this week</h3>';
  h += '<p>Opened in Rounds ' + (fmt(st.opened) || 'not yet') + '.</p>';
  h += ks.length ? '<p>Days with entries: ' + ks.map(function (k) { return fmtDay(k) + ' (' + st.days[k] + ' edit' + (st.days[k] === 1 ? '' : 's') + ')'; }).join(', ') + '.</p>'
                 : '<p>Nothing typed yet.</p>';
  if (st.exports && st.exports.length) { h += '<p>Exported to PDF: ' + st.exports.map(fmt).join(', ') + '.</p>'; }
  return h + '<p class="note">Times come from this computer\'s clock (24-hour).</p></div>';
}

var saveTimer = null;
function flush() {
  clearTimeout(saveTimer); saveTimer = null;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
/* A student who types and shuts the laptop should not lose the last sentence,
   so the debounce is flushed the moment the page is hidden or unloaded. */
window.addEventListener('pagehide', flush);
window.addEventListener('beforeunload', flush);
document.addEventListener('visibilitychange', function () { if (document.hidden) { flush(); } });
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    try {
      localStorage.setItem(KEY, JSON.stringify(S));
      document.getElementById('saved').textContent = 'Saved in this browser a moment ago. Export the PDF before you close it.';
    } catch (e) {
      document.getElementById('saved').textContent = 'This browser will not let the page save. Keep the tab open and export the PDF before you leave.';
    }
  }, 350);
}

/* ---------- small helpers ---------- */
function esc(s) { return String(s == null ? '' : s); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function nums(s) { var f = String(s).match(/-?\d+(?:\.\d+)?/g); return f ? f.join(' ') : ''; }

/* ---------- the charting lessons. HOW, never WHAT. ---------- */
var LESSONS = {
  time: { title:'A vital sign is filed against a time, not a day',
    how:'Every column on a flowsheet has a time at the top, and everything in that column was true at that time. Before you write a single value, write the time. Two sets of vitals taken four minutes apart are two columns, not one, because the whole reason anybody took the second set was to see what changed in those four minutes. A chart that loses the time has lost the finding.' },
  weight: { title:'A weight is a vital sign, and it belongs in the grid',
    how:'Weight goes in the flowsheet row with the heart rate and the blood pressure, not into a sentence in the note. It goes there because a weight is only ever useful next to another weight, and a row is what lets you see three of them at once. In a patient whose problem is water, the scale is often the most sensitive instrument on the unit and it costs nothing.' },
  trend: { title:'A value goes in a column so it can become a row',
    how:'One number is a fact. A row of numbers is a direction, and direction is what clinical reasoning runs on. That is the whole argument for a flowsheet: not tidiness, but the fact that a row can be read left to right in one second by someone who has never met the patient. File the value in the right row even when it feels lonely, because the row is what you are building.' },
  source: { title:'A chart says where a number came from',
    how:'A potassium from a laboratory, a potassium from a blood gas machine and a change on an ECG are three different kinds of evidence about the same ion, and they do not always agree. Good charting keeps them apart: the laboratory value in the laboratory row, the bedside value in the bedside row, the ECG in the note. When they disagree, the disagreement is the finding, and you can only see it if you did not merge them.' },
  components: { title:'A score is charted as its parts',
    how:'Scores are shorthand for several separate observations and the shorthand throws away most of the information. Chart the parts. A Glasgow Coma Scale charted as three components tells the next person which pathway changed; charted as a total it tells them almost nothing, and two patients with the same total can need completely different things.' },
  absent: { title:'Chart what you looked for and did not find',
    how:'A normal finding you actively checked is evidence, and it is evidence that disappears if you only write down abnormal things. No fasciculation, sensation intact, no casts in the urine: each of those took someone time and each of them rules something out. The next person cannot tell the difference between a thing that was normal and a thing nobody looked at unless you write it.' },
  unmeasured: { title:'Chart the loss nobody measured, as unmeasured',
    how:'Sweat, breath, stool, a bed that was changed: real fluid leaves by routes no chart has a column for. The honest entry is the words not measured, with a note of why. A blank looks like zero to the next reader and a guess looks like a measurement. Neither is true, and the difference will matter when someone adds the column up and cannot make it agree with the scale.' },
  derived: { title:'A number you calculated is not a number you read',
    how:'A mean arterial pressure, a resistance, an anion gap, an energy availability: these are worked out from other numbers and they inherit every error in them. Chart them where they can be seen next to their ingredients, and be ready to show the arithmetic. If you cannot point at the two or three values a derived number came from, you should not be acting on it.' },
  closing: { title:'Closing a problem is a clinical act',
    how:'Problems get opened easily and closed almost never, which is how a list becomes useless. Closing one means saying what resolved it and what evidence convinced you, in the same field where you wrote why you opened it. A list where nothing ever closes cannot be read at speed, and a list nobody reads at speed is not doing its job.' },
  heldmed: { title:'A held medication stays on the record',
    how:'There is a difference between a drug that was stopped and a drug that is being held, and the record must show which. Held means someone decided, today, that this patient should not have it, and it means someone has to decide again tomorrow. Delete it and the decision vanishes, and a drug that was deliberately withheld quietly comes back a week later because nobody knew it had been paused.' },
  settings: { title:'A set value and a measured value are not the same row',
    how:'On a ventilated patient some numbers were chosen by a person and some were produced by the patient. A set rate is an instruction; a measured rate is a response. Keep them in different rows and label them, because the interesting moment is always when the two stop matching, and you cannot see that moment if they share a line.' },
  compare: { title:'A comparison is only as good as the grid it sits in',
    how:'Putting two patients, or two days, side by side is the most powerful thing a chart can do and the easiest to do badly. It works when the rows mean the same thing in both columns: the same units, the same conditions, the same kind of measurement. It misleads when they do not. Before you compare, check that the rows line up, and say out loud what you are holding constant.' }
};

/* ---------- normalized comparison for the flowsheet check ---------- */
var TEXTROWS = { o2:1, pupils:1, dtr:1, uo:1 };
function matches(typed, want) {
  var a = nums(typed), b = nums(want);
  if (a && b) { return a === b; }
  return String(typed).trim().toLowerCase().replace(/\s+/g, ' ') ===
         String(want).replace(/<[^>]+>/g, '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function wireChart() {

function checkCells(sel, source, msgHost, what) {
  var ok = 0, bad = 0, blank = 0, skipped = 0;
  document.querySelectorAll(sel).forEach(function (td) {
    var key = td.dataset.key, c = parseInt(td.dataset.ci, 10), inp = td.querySelector('input');
    if (!inp) { return; }
    var want = String(source[c][key]).replace(/<[^>]+>/g, '');
    var old = td.querySelector('.cellmsg'); if (old) { old.remove(); }
    td.className = '';
    if (!inp.value.trim()) { blank++; return; }
    if (TEXTROWS[key] && !nums(want)) { skipped++; return; }
    if (matches(inp.value, want)) { ok++; td.className = 'ok'; td.appendChild(el('span', 'cellmsg', 'Matches')); }
    else { bad++; td.className = 'no'; td.appendChild(el('span', 'cellmsg', 'Check this one')); }
  });
  var host = document.getElementById(msgHost);
  var cls = bad ? 'flash bad' : 'flash';
  var lines = [];
  lines.push('<strong>' + ok + '</strong> of the cells you filled match the chart.');
  if (bad) { lines.push('<strong>' + bad + '</strong> do not. They are outlined; go back to the note and read them again rather than guessing.'); }
  if (blank) { lines.push('<strong>' + blank + '</strong> are still empty.'); }
  if (skipped) { lines.push('<strong>' + skipped + '</strong> are written in words, so they are not checked automatically. Read those back yourself.'); }
  if (!bad && !blank) { lines.push('That is the whole of ' + what + ' filed correctly. Copying the numbers in yourself is the work, and you did it.'); }
  host.innerHTML = '<div class="' + cls + '"><p>' + lines.join(' ') + '</p></div>';
}

/* ---------- step rendering ---------- */
function field(key, label, hint, minChars, tall) {
  var box = el('div', 'qbox');
  var id = 'a-' + key;
  box.appendChild(el('label', 'fl', esc(label)));
  box.lastChild.setAttribute('for', id);
  if (hint) { box.appendChild(el('p', 'hint', hint)); }
  var ta = el('textarea');
  ta.id = id;
  ta.value = S.answers[key] || '';
  if (tall) { ta.style.minHeight = '150px'; }
  ta.setAttribute('aria-describedby', id + '-c');
  box.appendChild(ta);
  var c = el('p', 'count'); c.id = id + '-c';
  function upd() {
    var n = ta.value.trim().length;
    c.textContent = minChars
      ? (n >= minChars ? n + ' characters. That is enough to move on.' : n + ' of at least ' + minChars + ' characters.')
      : n + ' characters.';
  }
  ta.addEventListener('input', function () { S.answers[key] = ta.value; stamp('a-' + key); upd(); save(); gateCheck(); });
  upd();
  box.appendChild(c);
  return box;
}

function gateCheck() {
  var s = steps[idx];
  var nb = document.getElementById('next');
  if (s && s.gate) {
    var ready = predicted();
    nb.disabled = !ready;
    nb.textContent = ready ? 'Next step' : 'Write your prediction first';
    buildTabs();
    if (activeTab === 'flow' || activeTab === 'res') { paintChart(); }
  } else {
    nb.disabled = idx >= steps.length - 1;
    nb.textContent = idx >= steps.length - 1 ? 'You are at the last step' : 'Next step';
  }
}

function renderStep() {
  var s = steps[idx];
  root.innerHTML = '';
  document.getElementById('stepnum').textContent = 'Step ' + (idx + 1) + ' of ' + steps.length;
  document.getElementById('steph').textContent = s.title;
  document.getElementById('prog').textContent =
    'Week ' + WK + ', ' + wk.title + '. ' + P.name + '. ' + steps.length + ' steps, and you can come back to any of them.';

  var c = ex.coach;

  if (s.id === 'arrive') {
    root.appendChild(el('p', 'lede', esc(ex.location) + '. ' + esc(ex.encounterType) + '.'));
    root.appendChild(el('p', 'say', wk.arc));
    if (wk.tools && wk.tools.length) {
      var t = el('div', 'watch');
      t.appendChild(el('p', 'plabel', 'Handed to you before you start'));
      wk.tools.forEach(function (x) {
        t.appendChild(el('p', null, '<strong>' + x[0] + '.</strong> ' + x[1]
          + (x[2] ? ' <strong>You build this properly in Week ' + x[2] + '.</strong>' : '')));
      });
      root.appendChild(t);
    }
    root.appendChild(el('p', 'note', 'Work left to right: the steps run down this side, and the chart on the right fills up as you go. Nothing is filled in for you.'));

  } else if (s.id === 'predict') {
    root.appendChild(el('p', 'say', c.predict));
    root.appendChild(field('predict', 'Your prediction',
      'Say what you expect and why. You are not being marked on whether you are right, and a prediction you later abandon is worth more than one you never made. At least 80 characters.', 80));
    var w = el('div', 'watch');
    w.appendChild(el('p', 'plabel', 'Why this comes first'));
    w.appendChild(el('p', null, 'The Flowsheet and Results tabs are locked until this is written. At the moment your own reasoning is what counts, there is nothing on the screen to read off, and nothing for anything else to read off either.'));
    root.appendChild(w);

  } else if (s.beat != null) {
    if (s.beat > S.seen) { S.seen = s.beat; save(); paintChart(); }
    var row = wk.chart[s.beat];
    var b = el('div', 'beat');
    b.appendChild(el('h3', null, row[0]));
    b.appendChild(el('p', null, row[1]));
    root.appendChild(b);
    if (s.beat === 0) { root.appendChild(el('p', 'note', 'Read each part of the chart on its own before you read the next. This is the same order the team saw it in.')); }
    if (s.beat === wk.chart.length - 1) { root.appendChild(el('p', 'note', 'That is the whole note. It stays available under the Notes tab for the rest of the week.')); }

  } else if (s.id === 'lesson') {
    var L = LESSONS[c.lesson[0]];
    root.appendChild(el('p', 'say', L.how));
    var lw = el('div', 'watch');
    lw.appendChild(el('p', 'plabel', 'Now answer this'));
    lw.appendChild(el('p', null, c.lesson[1]));
    root.appendChild(lw);
    root.appendChild(field('lesson', 'Your answer', 'Two or three sentences. This is about how a chart works, not about this patient.', 60));

  } else if (s.id === 'vitals') {
    root.appendChild(el('p', 'say', c.vitals));
    root.appendChild(el('p', 'note', ex.prefiled
      ? 'This week arrives already filed, because you charted it on paper. Open the Flowsheet tab and read across the rows.'
      : 'Open the Flowsheet tab on the right and type this week’s values in. Read them out of the Notes and Results tabs; nothing is filled in for you. Then use Check my filing.'));
    root.appendChild(openBtn('flow', 'Open the flowsheet'));

  } else if (s.id === 'io') {
    root.appendChild(el('p', 'say', c.io));
    root.appendChild(el('p', 'note', 'Open the Intake and output tab. The three totals and the running balance are arithmetic, not lookups.'));
    root.appendChild(openBtn('io', 'Open intake and output'));

  } else if (s.id === 'results') {
    root.appendChild(el('p', 'say', c.results));
    root.appendChild(openBtn('res', 'Open the results'));
    root.appendChild(field('results', 'Your answer',
      'Answer the question above. Name the results you are using, with their values.', 80));

  } else if (s.id === 'problems') {
    root.appendChild(el('p', 'say', c.problems));
    root.appendChild(field('problems', 'Problem list, added to or changed this week',
      'Number them and keep the same numbers all term. For each one: the problem in your words, the evidence, and whether it is new, changed, or resolved.', 80, true));

  } else if (s.id === 'mar') {
    root.appendChild(el('p', 'say', c.mar));
    root.appendChild(openBtn('mar', 'Open the medication record'));
    root.appendChild(field('mar', 'Your answer', 'Answer the question above, using what is actually on the record.', 60));

  } else if (s.id === 'draw') {
    root.appendChild(el('p', 'say', 'Draw the control loop for this week on paper: the regulated variable, the sensor, the integrating center, the effector, and where in the loop this patient is being pushed or is failing. Label every arrow with a direction.'));
    root.appendChild(el('p', 'note', 'Photograph it and upload the photo with your PDF. Drawings are not saved by this page, which is the other reason to export every week.'));
    root.appendChild(field('draw', 'Describe your drawing in words',
      'The description is marked with the drawing. If you cannot describe it, the drawing is not finished.', 100, true));

  } else if (s.id === 'five') {
    root.appendChild(el('p', 'note', 'Everyone answers these five, whichever entry point you chose. A correct number with no explanation earns half credit, the same as every week.'));
    wk.five.forEach(function (q, i) {
      root.appendChild(field('q' + i, 'Question ' + (i + 1), q, 100, true));
    });

  } else if (s.id === 'desk') {
    var tid = S.track, t = null;
    C.tracks.forEach(function (x) { if (x.id === tid) { t = x; } });
    if (!t) {
      root.appendChild(el('p', 'say', 'You have not picked an entry point on this device yet. Pick the one you have used all term.'));
      var sel = el('div', 'qbox');
      C.tracks.forEach(function (x) {
        var b = el('button', 'btn', esc(x.name));
        b.type = 'button';
        b.style.margin = '0 8px 8px 0';
        b.addEventListener('click', function () {
          S.track = x.id;
          try { localStorage.setItem(TRACKKEY, x.id); } catch (e) {}
          save(); renderStep();
        });
        sel.appendChild(b);
      });
      root.appendChild(sel);
    } else {
      var d = wk.tracks[t.id];
      root.appendChild(el('p', 'plabel', t.name));
      root.appendChild(el('p', 'say', d.data));
      var dw = el('div', 'watch');
      dw.appendChild(el('p', 'plabel', 'Work it'));
      dw.appendChild(el('p', null, d.go));
      root.appendChild(dw);
      root.appendChild(field('desk', 'Your answer', 'From your desk, in your discipline’s language.', 150, true));
    }

  } else if (s.id === 'note') {
    root.appendChild(el('p', 'say', c.note));
    root.appendChild(el('p', 'note', 'Four fields, in the order every progress note in every hospital uses. Subjective is what the patient or the family says. Objective is what you measured or observed. Assessment is what you think is happening and why. Plan is what happens next and what would change it.'));
    root.appendChild(field('noteS', 'Subjective', 'What the patient, or somebody at the bedside, said. If nobody could speak, say that.', 0));
    root.appendChild(field('noteO', 'Objective', 'The numbers and the findings. Refer to your flowsheet rather than repeating it.', 0));
    root.appendChild(field('noteA', 'Assessment', 'The physiology, in your words, with the evidence attached. This is the part that is marked.', 120, true));
    root.appendChild(field('noteP', 'Plan', 'What happens next, and the one number that would change it.', 60));

  } else if (s.id === 'sign') {
    var nm = el('div', 'qbox');
    nm.appendChild(el('label', 'fl', 'Your name, exactly as it appears in Canvas'));
    nm.lastChild.setAttribute('for', 'signname');
    var inp = el('input'); inp.type = 'text'; inp.id = 'signname'; inp.value = S.name || '';
    inp.addEventListener('input', function () { S.name = inp.value; stamp('name'); save(); });
    nm.appendChild(inp);
    root.appendChild(nm);
    root.appendChild(field('ai', 'Your AI log for this week',
      'What you asked, what you got, and what you did with it. One line saying you used none is a complete answer and has never cost anyone a mark.', 0));
    var br = el('div', 'btnrow noprint');
    var pb = el('button', 'btn pri', 'Export this week to PDF'); pb.type = 'button';
    pb.addEventListener('click', function () { S.exports.push(new Date().toISOString()); flush(); activeTab = 'mine'; buildTabs(); paintChart(); setTimeout(function () { window.print(); }, 120); });
    var cr = caseRange();
    var wb = el('button', 'btn', 'Export the whole case, Weeks ' + cr.from + ' to ' + cr.to + ', to PDF'); wb.type = 'button';
    wb.addEventListener('click', function () { flush(); printCase(); });
    var cb = el('button', 'btn', 'Show my save code'); cb.type = 'button';
    cb.setAttribute('aria-expanded', 'false');
    cb.setAttribute('aria-controls', 'codewrap');
    var rb = el('button', 'btn', 'Paste a save code back in'); rb.type = 'button';
    rb.setAttribute('aria-expanded', 'false');
    rb.setAttribute('aria-controls', 'restorewrap');
    br.appendChild(pb); br.appendChild(wb); br.appendChild(cb); br.appendChild(rb);
    root.appendChild(br);
    root.appendChild(el('p', 'note', '<strong>At the end of the case</strong>, in the week of ' + cr.exam + ', click Export the whole case. '
      + 'It puts every week you charted in this browser into one PDF, with the date and time of every entry. '
      + 'Upload that PDF to the Canvas assignment for ' + P.name.split(' ')[0] + '\'s chart, due ' + cr.due + '. '
      + (cr.paper ? 'Upload your scanned paper pages for Weeks ' + cr.paper + ' in the same submission. ' : '')
      + 'Export each week as you go too, as a backup.'));

    var cw = el('div', 'qbox'); cw.id = 'codewrap'; cw.hidden = true;
    cw.appendChild(el('label', 'fl', 'Copy this and keep it somewhere you own'));
    cw.lastChild.setAttribute('for', 'savecode');
    var ta = el('textarea', 'code'); ta.id = 'savecode'; ta.readOnly = true;
    cw.appendChild(ta);
    root.appendChild(cw);
    cb.addEventListener('click', function () {
      var open = cw.hidden;
      cw.hidden = !open;
      cb.setAttribute('aria-expanded', String(open));
      if (open) { try { ta.value = btoa(encodeURIComponent(JSON.stringify(S))); } catch (e) { ta.value = 'This browser could not make a code.'; } ta.focus(); }
    });

    var rw = el('div', 'qbox'); rw.id = 'restorewrap'; rw.hidden = true;
    rw.appendChild(el('label', 'fl', 'Paste a code from another machine'));
    rw.lastChild.setAttribute('for', 'restorecode');
    var rta = el('textarea', 'code'); rta.id = 'restorecode';
    rw.appendChild(rta);
    var rgo = el('button', 'btn', 'Restore'); rgo.type = 'button'; rgo.style.marginTop = '10px';
    rw.appendChild(rgo);
    var rmsg = el('p', 'note'); rmsg.setAttribute('aria-live', 'polite');
    rw.appendChild(rmsg);
    root.appendChild(rw);
    rb.addEventListener('click', function () {
      var open = rw.hidden; rw.hidden = !open; rb.setAttribute('aria-expanded', String(open)); if (open) { rta.focus(); }
    });
    rgo.addEventListener('click', function () {
      try {
        var got = JSON.parse(decodeURIComponent(atob(rta.value.trim())));
        if (!got || got.week !== WK) { rmsg.textContent = 'That code is for a different week. Open that week and paste it there.'; return; }
        S = Object.assign(S, got); save(); rmsg.textContent = 'Restored. Your typing is back.'; renderStep(); paintChart();
      } catch (e) { rmsg.textContent = 'That code did not read. Paste the whole thing, with no line breaks removed.'; }
    });

    root.appendChild(el('p', 'note', 'The PDF is the assignment. What sits in this browser is not a submission, and a browser that gets cleared takes your typing with it.'));
  }

  document.querySelectorAll('.rail button').forEach(function (b, i) {
    b.setAttribute('aria-current', i === idx ? 'step' : 'false');
    b.className = (i < idx || S.done[steps[i].id]) ? 'done' : '';
  });
  document.getElementById('prev').disabled = idx === 0;
  gateCheck();
  document.getElementById('steph').focus();
}

/* ---------- the whole case in one PDF ---------- */
function caseRange() {
  var ws = Object.keys(C.patientByWeek).map(Number).filter(function (w) { return C.patientByWeek[w] === pKey; }).sort(function (a, b) { return a - b; });
  var paper = ws.filter(function (w) { return E.weeks[w] && E.weeks[w].prefiled; });
  var A = pKey === 'A';
  return { weeks:ws, from:ws[0], to:ws[ws.length - 1],
    paper: paper.length ? (paper.length === 1 ? String(paper[0]) : paper[0] + ' to ' + paper[paper.length - 1]) : '',
    exam: A ? 'Midterm 1' : 'Midterm 2',
    due: A ? 'Sunday, November 1, at 10:00 pm, with Midterm 1' : 'Wednesday, December 16, at 10:00 pm, with Midterm 2' };
}
function staticTable(cols, rowsDef, get, caption) {
  var h = '<table><caption>' + caption + '</caption><thead><tr><th scope="col">Measure</th>';
  cols.forEach(function (c) { h += '<th scope="col">' + esc(c.t) + '</th>'; });
  h += '</tr></thead><tbody>';
  rowsDef.forEach(function (r) {
    if (r.grp) { h += '<tr class="grp"><th scope="row" colspan="' + (cols.length + 1) + '">' + r.grp + '</th></tr>'; return; }
    h += '<tr><th scope="row">' + r[1] + '<span class="u">' + (r[2] || '') + '</span></th>';
    cols.forEach(function (c, ci) {
      h += '<td>' + (c[r[0]] == null ? '' : String(get(r[0], ci, c[r[0]]) || '').replace(/</g, '&lt;')) + '</td>';
    });
    h += '</tr>';
  });
  return h + '</tbody></table>';
}
function printCase() {
  var cr = caseRange(), host = document.getElementById('caseprint'), h = '';
  var signer = S.name;
  cr.weeks.forEach(function (w) { if (!signer) { try { var t = JSON.parse(localStorage.getItem('bio005-rounds-v1-w' + w) || 'null'); if (t && t.name) { signer = t.name; } } catch (e) {} } });
  h += '<h1>' + esc(P.name) + ': the whole case, Weeks ' + cr.from + ' to ' + cr.to + '</h1>'
    + '<p>' + (signer ? esc(signer).replace(/</g, '&lt;') + '. ' : '') + 'Exported ' + fmt(new Date().toISOString()) + '. Due ' + cr.due + '.</p>';
  if (cr.paper) { h += '<p><strong>Weeks ' + cr.paper + ' were charted on paper.</strong> Your handwritten pages for those weeks go in the same Canvas submission as this PDF.</p>'; }
  cr.weeks.forEach(function (w) {
    var exw = E.weeks[w], wkw = C.weeks[w];
    if (!exw || !wkw) { return; }
    var st = null;
    try { st = JSON.parse(localStorage.getItem('bio005-rounds-v1-w' + w) || 'null'); } catch (e) {}
    if (w === WK) { st = S; }
    if (exw.prefiled) { return; }
    h += '<section class="cweek"><h2>Week ' + w + ': ' + esc(wkw.title) + '</h2>';
    if (!st || !st.answers) {
      h += '<p><strong>Nothing charted in Rounds for this week in this browser.</strong> If you charted it on another computer, open Week ' + w + ' in Rounds here, paste that week\'s save code, and export again.</p></section>';
      return;
    }
    h += activityHtml(st);
    var rowsDef = [];
    E.groups.forEach(function (g) {
      var rs = g.rows.filter(function (r) { return exw.flow.some(function (c) { return c[r[0]] != null; }); });
      if (rs.length) { rowsDef.push({ grp:g.name }); rowsDef = rowsDef.concat(rs); }
    });
    h += staticTable(exw.flow, rowsDef, function (k, ci) { return (st.flow || {})['f-' + k + '-' + ci]; }, 'Flowsheet, week ' + w);
    if (exw.io) { h += staticTable(exw.io, E.ioRows, function (k, ci) { return (st.io || {})['io-' + k + '-' + ci]; }, 'Intake and output, week ' + w); }
    h += entriesHtml(st, wkw) + '</section>';
  });
  host.innerHTML = h;
  document.body.classList.add('printcase');
  var done = function () { document.body.classList.remove('printcase'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(function () { window.print(); }, 120);
}

function openBtn(tab, label) {
  var b = el('button', 'btn noprint', esc(label));
  b.type = 'button';
  b.addEventListener('click', function () {
    activeTab = tab; buildTabs(); paintChart();
    var p = document.getElementById('panel-' + tab); if (p) { p.focus(); }
  });
  var w = el('div', 'btnrow'); w.appendChild(b);
  return w;
}

/* ---------- rail ---------- */
(function () {
  var r = document.getElementById('rail');
  steps.forEach(function (s, i) {
    var li = el('li');
    var b = el('button', null, esc(s.label));
    b.type = 'button';
    b.addEventListener('click', function () {
      idx = i;
      /* Jumping down the rail opens the note as far as the step you jumped to,
         so the rail is a shortcut and never a way past the prediction. */
      for (var j = 0; j <= i; j++) {
        if (steps[j].beat != null && steps[j].beat > S.seen) { S.seen = steps[j].beat; }
      }
      save(); renderStep(); paintChart();
    });
    li.appendChild(b);
    r.appendChild(li);
  });
}());

document.getElementById('next').addEventListener('click', function () {
  S.done[steps[idx].id] = true; save();
  if (idx < steps.length - 1) { idx++; renderStep(); }
});
document.getElementById('prev').addEventListener('click', function () {
  if (idx > 0) { idx--; renderStep(); }
});

buildTabs();
paintChart();
renderStep();
}());
</script>
<script>
/* Canvas iframe height sender. */
(function () {
  var id = 'bio005-patient-rounds';
  function post() {
    try { parent.postMessage({ frame:id, id:id, height:document.documentElement.scrollHeight }, '*'); } catch (e) {}
  }
  if ('ResizeObserver' in window) { new ResizeObserver(post).observe(document.documentElement); }
  window.addEventListener('load', post);
  window.addEventListener('resize', post);
  post();
}());
</script>
<div id="caseprint" aria-hidden="true"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawing Canvas &middot; BIO 004 Human Anatomy</title>
<meta name="description" content="A blank white canvas for drawing anatomy from memory. Pen sizes, lines, arrows, circles, boxes, and text. Save to PDF or print.">
<link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/plus-jakarta-sans/index.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--navy:#1E3D4C;--near-black:#142a36;--rust:#A0522D;--terra:#C2734D;--gold:#B8924A;--gold-light:#CFA95F;--white:#FFFFFF;--offwhite:#FAFAF9;--slate:#5B7480;--line:rgba(30,61,76,.14);--disp:'Plus Jakarta Sans Variable','Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--disp);background:var(--offwhite);color:var(--navy);font-size:16px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
button,select{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.bar{background:#fff;border-bottom:1px solid var(--line);padding:9px max(12px,2vw);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none}
.brand svg{height:30px;width:auto}
.brand .lt{font-size:14px;font-weight:800;color:var(--navy);line-height:1}
.brand .lt .ac{color:var(--rust)}
.title{font-weight:800;font-size:14.5px;color:var(--navy);margin-left:4px;padding:5px 12px;background:var(--white);border-radius:999px}
.grow{flex:1}
.toolbar{background:#fff;border-bottom:1px solid var(--line);padding:8px max(12px,2vw);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tgroup{display:flex;gap:4px;align-items:center;padding-right:8px;border-right:1px solid var(--line)}
.tgroup:last-child{border-right:0}
/* opacity .55 put these at 3.14:1 at 9.5px. Solid color instead. */
.tlabel{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4A5C6B;margin-right:2px}
.tbtn{border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:8px;padding:8px 11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.tbtn:hover{border-color:var(--navy)}
.tbtn[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
/* Navy on brushed gold is 3.96:1, under the 4.5:1 a 13px bold label
   needs. Near-black on the same gold is 6.6:1. */
.tbtn.gold{background:var(--gold);border-color:var(--gold);color:#05080F}
.tbtn.gold:hover{background:var(--gold-light)}
.sz{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center}
.sz i{display:block;border-radius:50%;background:var(--navy)}
.tbtn[aria-pressed="true"] .sz i{background:#fff}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--navy)}
input[type=color]{width:36px;height:36px;border:1.5px solid var(--line);border-radius:8px;background:#fff;padding:2px}
.stage{flex:1;padding:14px max(12px,2vw);display:flex}
.canvas-wrap{flex:1;background:#fff;border:1px solid var(--slate);border-radius:12px;box-shadow:0 1px 3px rgba(30,61,76,.08);overflow:hidden;position:relative;min-height:60vh}
#pad{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;background:#fff}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--navy);opacity:.5;pointer-events:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media print{
  .bar,.toolbar,.hint{display:none!important}
  .stage{padding:0}
  .canvas-wrap{border:0;box-shadow:none;border-radius:0}
  body{background:#fff}
}
@media (max-width:640px){.tlabel{display:none}}

/* DRAWING PROMPTS
   69 prompts already existed in draw-checklists.js with their week, their
   code and their tickable list. The canvas opened blank and showed none of
   them, so a student arrived at a drawing tool with nothing to draw.
   Scoped to what has been taught, and they come one after another. */
/* THE PROMPT CARD.
   This carried a 1px border and a 4px terra bar down its left edge, and
   the control row under it was three different shapes: an outlined
   circle, a navy pill, a browser-default select with its own grey
   border, and another outlined pill. Four borders, three heights, two
   idioms.

   The rule this course runs on is white cards on an off-white page,
   depth from shadow, no borders and no bars. So: one card on a shadow,
   and one row of controls that are all the same height, the same
   radius, the same white, all lifting on the same shadow. Only the
   thing you press next is gold. */
.dp{margin:0 0 16px;padding:20px 22px;background:#fff;border:0;border-radius:14px;
  box-shadow:0 2px 6px rgba(8,16,31,.08), 0 12px 26px -14px rgba(8,16,31,.22)}
.dp-eyebrow{margin:0 0 4px;font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#6B1616}
.dp-name{margin:0 0 8px;font-size:20px;font-weight:800;color:#08101F;letter-spacing:-.01em}
.dp-brief{margin:0 0 16px;font-size:15.5px;line-height:1.6;color:#3D4757;max-width:70ch}

.dp-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dp-btn{font:inherit;font-size:13.5px;font-weight:700;height:46px;padding:0 20px;cursor:pointer;
  border-radius:999px;border:0;background:#fff;color:#08101F;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 1px 3px rgba(8,16,31,.10);
  transition:transform 160ms ease, box-shadow 160ms ease, background 160ms ease}
.dp-btn:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(8,16,31,.14)}
.dp-btn:active{transform:translateY(0)}
.dp-btn:focus-visible{outline:3px solid #6B1616;outline-offset:3px}
.dp-primary{background:#DCB45C;color:#05080F}
.dp-primary:hover{background:#C9A24A}

.dp-nav{display:flex;gap:8px;align-items:center}
/* a round button, the same height as everything beside it */
.dp-arrow{width:46px;height:46px;padding:0;border-radius:50%;font-size:17px;line-height:1}

/* The select keeps its native behavior, which is what makes it work on
   a phone and with a keyboard, and loses its native chrome. */
.dp-pick{position:relative;display:inline-flex;align-items:center}
.dp-pick select{font:inherit;font-size:13.5px;font-weight:700;height:46px;
  padding:0 40px 0 20px;border:0;border-radius:999px;background:#fff;color:#08101F;
  box-shadow:0 1px 3px rgba(8,16,31,.10);cursor:pointer;
  max-width:min(360px,40vw);text-overflow:ellipsis;
  -webkit-appearance:none;appearance:none;
  transition:transform 160ms ease, box-shadow 160ms ease}
.dp-pick:hover select{transform:translateY(-2px);box-shadow:0 8px 16px rgba(8,16,31,.14)}
.dp-pick select:focus-visible{outline:3px solid #6B1616;outline-offset:3px}
.dp-pick::after{content:'';position:absolute;right:17px;top:50%;width:8px;height:8px;
  margin-top:-5px;border-right:2px solid #6B1616;border-bottom:2px solid #6B1616;
  transform:rotate(45deg);pointer-events:none}
.dp-count{font-size:12.5px;font-weight:600;color:#4A5C6B;margin-left:auto}
@media (prefers-reduced-motion:reduce){
  .dp-btn,.dp-pick select{transition:none}
  .dp-btn:hover,.dp-pick:hover select{transform:none}
}
.dp-count{font-size:13px;color:#3D4757;margin-left:auto}
.dp-listwrap{margin-top:14px;padding-top:14px;border-top:1px solid rgba(11,21,48,.14)}
.dp-standard{margin:0 0 10px;font-size:14px;color:#08101F;font-weight:700}
.dp-items{list-style:none;margin:0 0 12px;padding:0;columns:2;column-gap:26px}
@media (max-width:720px){.dp-items{columns:1}}
.dp-items li{break-inside:avoid;position:relative;padding-left:24px;margin:0 0 7px;font-size:14.5px;line-height:1.5;color:#08101F}
.dp-items li::before{content:"";position:absolute;left:2px;top:.42em;width:11px;height:11px;
  border:1.5px solid #8B3A2E;border-radius:3px}
.dp-know{margin:0;font-size:14px;line-height:1.55;color:#3D4757}
</style>

<body>

  <a class="brand" href="https://drsrennie-stack.github.io/new-build-bio4-solano/welcome.html" target="_top" aria-label="BIO 004 Human Anatomy, course home">
    <svg viewBox="40 10 125 148" role="img" aria-hidden="true" focusable="false"><g transform="translate(0,18)"><g transform="translate(60,0) rotate(8 0 130)"><circle cx="0" cy="20" r="10" fill="#1E3D4C"/><path d="M 0,32 C -10,32 -16,36 -16,42 C -16,55 -13,68 -11,82 C -10,100 -12,118 -14,130 L 14,130 C 12,118 10,100 11,82 C 13,68 16,55 16,42 C 16,36 10,32 0,32 Z" fill="#1E3D4C"/></g><g transform="translate(100,0)"><circle cx="0" cy="10" r="11" fill="#A0522D"/><path d="M 0,22 C -11,22 -17,26 -17,34 C -17,52 -14,70 -12,86 C -11,108 -13,122 -15,132 L 15,132 C 13,122 11,108 12,86 C 14,70 17,52 17,34 C 17,26 11,22 0,22 Z" fill="#A0522D"/></g><g transform="translate(140,0) rotate(-8 0 130)"><circle cx="0" cy="20" r="10" fill="#B8924A"/><path d="M 0,32 C -10,32 -16,36 -16,42 C -16,55 -13,68 -11,82 C -10,100 -12,118 -14,130 L 14,130 C 12,118 10,100 11,82 C 13,68 16,55 16,42 C 16,36 10,32 0,32 Z" fill="#B8924A"/></g></g></svg>
    <span class="lt">Human <span class="ac">Anatomy</span></span>
  </a>
  <span class="title" id="title">Drawing Canvas</span>
  <span class="grow"></span>
  <button class="tbtn" id="undo" aria-label="Undo last action"><span aria-hidden="true">&#8630;</span> Undo</button>
  <button class="tbtn" id="clear" aria-label="Clear the canvas">Clear</button>
  <button class="tbtn gold" id="checkBtn" aria-label="Check my work against the checklist" hidden>Check my work</button>

</nav>
<script src="draw-checklists.js"></script>
<section class="dp" id="dp" hidden aria-labelledby="dp-h">
  <p class="dp-eyebrow" id="dp-h">Drawing <span id="dp-code"></span> &middot; <span id="dp-wk"></span></p>
  <h2 class="dp-name" id="dp-name"></h2>
  <p class="dp-brief" id="dp-brief"></p>
  <div class="dp-actions">
    <!-- Next used to be the only control, and it wrapped from the last
         prompt to the first, so the only way back to the one before was
         to walk the whole list forward again. Back and forward now, and
         a picker so nobody has to walk anywhere. -->
    <div class="dp-nav" role="group" aria-label="Move between drawing prompts">
      <button type="button" class="dp-btn dp-arrow" id="dp-prev" aria-label="Previous prompt">
        <span aria-hidden="true">&larr;</span></button>
      <button type="button" class="dp-btn dp-primary" id="dp-next">Next prompt <span aria-hidden="true">&rarr;</span></button>
    </div>
    <span class="dp-pick">
      <select id="dp-jump" aria-label="Jump to a drawing prompt"></select>
    </span>
    <button type="button" class="dp-btn" id="dp-check" aria-expanded="false" aria-controls="dp-list">Show the self-check list</button>
    <span class="dp-count" id="dp-count" role="status" aria-live="polite"></span>
  </div>
  <div class="dp-listwrap" id="dp-list" hidden>
    <p class="dp-standard" id="dp-standard"></p>
    <ul class="dp-items" id="dp-items"></ul>

  </div>
</section>
<main class="stage">
  <div class="canvas-wrap">
    <canvas id="pad"></canvas>
    <span class="hint" id="hint">Draw from memory. Pen, shapes, arrows, and text. Save to PDF when you are done.</span>
  </div>
  <aside class="checkpanel" id="checkPanel" hidden aria-label="Self-check and scoring"></aside>
</main>
<script>
"use strict";
(function(){
  var $=function(s){return document.querySelector(s);};
  var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
  var pad=$('#pad'), ctx=pad.getContext('2d');
  var state={tool:'pen',size:3,color:'#1E3D4C'};
  var objects=[], dpr=Math.max(1,window.devicePixelRatio||1);
  var W=0,H=0;

  /* title from ?title= or #comp= */
  (function(){
    var t=null;
    try{var p=new URLSearchParams(location.search);t=p.get('title')||p.get('comp');}catch(e){}
    if(!t&&location.hash){var m=location.hash.match(/(?:title|comp)=([^&]+)/);if(m)t=decodeURIComponent(m[1].replace(/\+/g,' '));}
    if(t){t=t.replace(/[<>]/g,'');$('#title').textContent=t;document.title=t+' · Drawing Canvas';}
  })();

  function resize(){
    var wrap=pad.parentElement, r=wrap.getBoundingClientRect();
    W=Math.max(320,Math.floor(r.width)); H=Math.max(360,Math.floor(r.height));
    pad.width=W*dpr; pad.height=H*dpr; pad.style.width=W+'px'; pad.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    redraw();
  }
  window.addEventListener('resize',resize);

  function stroke(o){
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle=o.erase?'#FFFFFF':o.color; ctx.fillStyle=o.erase?'#FFFFFF':o.color; ctx.lineWidth=o.size;
    if(o.tool==='pen'||o.tool==='erase'){
      ctx.beginPath(); var pts=o.pts; if(!pts.length)return;
      ctx.moveTo(pts[0].x,pts[0].y);
      for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
      if(pts.length===1){ctx.lineTo(pts[0].x+0.1,pts[0].y+0.1);}
      ctx.stroke();
    }else if(o.tool==='line'||o.tool==='arrow'){
      ctx.beginPath(); ctx.moveTo(o.x0,o.y0); ctx.lineTo(o.x1,o.y1); ctx.stroke();
      if(o.tool==='arrow'){
        var ang=Math.atan2(o.y1-o.y0,o.x1-o.x0), h=Math.max(9,o.size*3);
        ctx.beginPath(); ctx.moveTo(o.x1,o.y1);
        ctx.lineTo(o.x1-h*Math.cos(ang-0.4),o.y1-h*Math.sin(ang-0.4));
        ctx.moveTo(o.x1,o.y1);
        ctx.lineTo(o.x1-h*Math.cos(ang+0.4),o.y1-h*Math.sin(ang+0.4));
        ctx.stroke();
      }
    }else if(o.tool==='rect'){
      ctx.strokeRect(Math.min(o.x0,o.x1),Math.min(o.y0,o.y1),Math.abs(o.x1-o.x0),Math.abs(o.y1-o.y0));
    }else if(o.tool==='circle'){
      ctx.beginPath();
      ctx.ellipse((o.x0+o.x1)/2,(o.y0+o.y1)/2,Math.abs(o.x1-o.x0)/2,Math.abs(o.y1-o.y0)/2,0,0,Math.PI*2);
      ctx.stroke();
    }else if(o.tool==='text'){
      ctx.font='700 '+Math.max(13,o.size*5.5)+'px '+"'Plus Jakarta Sans Variable','Plus Jakarta Sans',sans-serif";
      ctx.textBaseline='top'; ctx.fillText(o.text,o.x,o.y);
    }
  }
  function redraw(prev){
    ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
    objects.forEach(stroke);
    if(prev)stroke(prev);
    ctx.restore();
  }

  function pos(e){var r=pad.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  var drawing=false, cur=null;
  pad.addEventListener('pointerdown',function(e){
    e.preventDefault(); pad.setPointerCapture(e.pointerId); var p=pos(e);
    if(state.tool==='text'){
      var txt=window.prompt('Text to place:'); if(txt){objects.push({tool:'text',color:state.color,size:state.size,x:p.x,y:p.y,text:txt});redraw();}
      return;
    }
    drawing=true;
    if(state.tool==='pen'||state.tool==='erase'){cur={tool:state.tool,erase:state.tool==='erase',color:state.color,size:state.tool==='erase'?Math.max(state.size,12):state.size,pts:[p]};}
    else{cur={tool:state.tool,color:state.color,size:state.size,x0:p.x,y0:p.y,x1:p.x,y1:p.y};}
  });
  pad.addEventListener('pointermove',function(e){
    if(!drawing||!cur)return; var p=pos(e);
    if(cur.tool==='pen'||cur.tool==='erase'){cur.pts.push(p);redraw(cur);}
    else{cur.x1=p.x;cur.y1=p.y;redraw(cur);}
  });
  function end(){if(drawing&&cur){objects.push(cur);}drawing=false;cur=null;redraw();}
  pad.addEventListener('pointerup',end);
  pad.addEventListener('pointercancel',end);
  pad.addEventListener('pointerleave',function(e){if(drawing)end();});

  /* tool + size + color selection */
  function press(sel,btn){$$(sel).forEach(function(b){b.setAttribute('aria-pressed','false');});btn.setAttribute('aria-pressed','true');}
  $$('.tool').forEach(function(b){b.addEventListener('click',function(){state.tool=b.getAttribute('data-tool');press('.tool',b);pad.style.cursor=(state.tool==='text')?'text':'crosshair';});});
  $$('.sizebtn').forEach(function(b){b.addEventListener('click',function(){state.size=parseFloat(b.getAttribute('data-size'));press('.sizebtn',b);});});
  $$('.swatch').forEach(function(b){b.addEventListener('click',function(){state.color=b.getAttribute('data-color');press('.swatch',b);$('#customColor').value=state.color;});});
  $('#customColor').addEventListener('input',function(){state.color=this.value;$$('.swatch').forEach(function(b){b.setAttribute('aria-pressed','false');});});

  /* undo / clear */
  $('#undo').addEventListener('click',function(){objects.pop();redraw();});
  $('#clear').addEventListener('click',function(){if(objects.length&&!window.confirm('Clear the whole canvas?'))return;objects=[];redraw();});

  /* save PDF */
  $('#savePdf').addEventListener('click',function(){
    try{
      var jsPDF=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF; if(!jsPDF){window.print();return;}
      var land=W>=H;
      var pdf=new jsPDF({orientation:land?'landscape':'portrait',unit:'pt',format:'letter'});
      var pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(), margin=36;
      var title=$('#title').textContent||'Drawing';
      pdf.setFont('helvetica','bold'); pdf.setFontSize(13); pdf.setTextColor('#1E3D4C');
      pdf.text(title,margin,margin);
      pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor('#666666');
      pdf.text('BIO 004 Human Anatomy · '+new Date().toLocaleDateString(),margin,margin+15);
      var img=pad.toDataURL('image/png');
      var availW=pw-margin*2, availH=ph-margin*2-30;
      var ratio=Math.min(availW/W,availH/H), dw=W*ratio, dh=H*ratio;
      pdf.addImage(img,'PNG',margin,margin+28,dw,dh);
      var safe=title.replace(/[^a-z0-9]+/gi,'-').toLowerCase().slice(0,40)||'drawing';
      pdf.save(safe+'.pdf');
    }catch(err){window.print();}
  });
  $('#printBtn').addEventListener('click',function(){window.print();});

  /* iframe height sender (harmless when opened full screen) */
  function sendH(){try{parent.postMessage({type:'resize',id:'mastery-canvas',height:(window.BIO004_CONTENT_HEIGHT ? window.BIO004_CONTENT_HEIGHT() : document.body.scrollHeight)},'*');}catch(e){}}
  window.addEventListener('load',sendH); window.addEventListener('resize',sendH);

  resize();
})();
</script>

<script>
/* One prompt at a time, in teaching order, scoped to what the course has
   actually covered. Next prompt walks the list, so a student can do several
   in a sitting without going back to a menu. */
(function () {
  var D = window.BIO004_DRAW || [];
  var host = document.getElementById('dp');
  if (!host || !D.length) return;

  var TERM_START = new Date(2026, 7, 17);
  function currentWeek() {
    var w = Math.floor((new Date() - TERM_START) / 604800000) + 1;
    return w < 1 ? 1 : (w > 17 ? 17 : w);
  }
  var wkNow = currentWeek();
  var pool = D.filter(function (d) { return d.week <= wkNow; });
  if (!pool.length) pool = D.filter(function (d) { return d.week === 1; });
  pool.sort(function (a, b) { return a.week - b.week || String(a.code).localeCompare(String(b.code)); });

  var KEY = 'bio004-draw-at';
  var i = 0;
  try { i = Math.max(0, Math.min(pool.length - 1, parseInt(localStorage.getItem(KEY), 10) || 0)); } catch (e) {}

  var listWrap = document.getElementById('dp-list');
  var checkBtn = document.getElementById('dp-check');

  function show() {
    var d = pool[i];
    document.getElementById('dp-code').textContent = d.code;
    document.getElementById('dp-wk').textContent = 'week ' + d.week;
    document.getElementById('dp-name').textContent = d.name;
    document.getElementById('dp-brief').textContent = d.brainDump || '';
    document.getElementById('dp-standard').textContent = d.standard || '';
    document.getElementById('dp-know').textContent = d.youKnowItWhen ? 'You know it when: ' + d.youKnowItWhen : '';
    document.getElementById('dp-items').innerHTML =
      (d.items || []).map(function (x) { return '<li>' + String(x).replace(/[<>&]/g, '') + '</li>'; }).join('');
    document.getElementById('dp-count').textContent = (i + 1) + ' of ' + pool.length + ' unlocked so far';
    var jp = document.getElementById('dp-jump');
    if (jp && jp.value !== String(i)) jp.value = String(i);
    listWrap.hidden = true;
    checkBtn.setAttribute('aria-expanded', 'false');
    checkBtn.textContent = 'Show the self-check list';
    host.hidden = false;
    try { localStorage.setItem(KEY, String(i)); } catch (e) {}
  }
  /* Wrapping in both directions on purpose: a student practicing the
     same six prompts over and over should never hit a wall at either
     end of the list. */
  function go(n) { i = (n + pool.length) % pool.length; show(); }
  document.getElementById('dp-next').addEventListener('click', function () { go(i + 1); });
  document.getElementById('dp-prev').addEventListener('click', function () { go(i - 1); });

  /* Arrow keys work anywhere on the page except inside a field, so a
     student with a stylus in one hand can move with the other. */
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(i + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(i - 1); }
  });

  var jump = document.getElementById('dp-jump');
  jump.innerHTML = pool.map(function (d, n) {
    return '<option value="' + n + '">' + (n + 1) + '. ' + String(d.name).replace(/[<>&]/g, '') + '</option>';
  }).join('');
  jump.addEventListener('change', function () { go(parseInt(jump.value, 10) || 0); });
  checkBtn.addEventListener('click', function () {
    var open = listWrap.hidden;
    listWrap.hidden = !open;
    checkBtn.setAttribute('aria-expanded', String(open));
    checkBtn.textContent = open ? 'Hide the self-check list' : 'Show the self-check list';
  });
  show();
})();
</script>

<script>
/* ============================================================
   Split-screen self-check, confidence, scoring and print.
   Added 2026-08-11.

   Before this, the canvas had no storage call of any kind, so a drawing
   made here produced no evidence at all, and the checklist lived on a
   different screen entirely. A student had to hold 17 items in their head
   while switching back and forth.

   Now: canvas on the left, checklist on the right, tick as you compare,
   score without leaving the page. Confidence is asked BEFORE the checklist
   is revealed, because a rating taken after seeing the answers is not a
   confidence rating, it is a memory of the answers. If Mastery OS already
   collected it (?conf=), it carries through and is not asked twice.

   Writes one row to bio004-evidence-v1 in the shape mastery-evidence.js
   reads, plus the confidence pairing:
       { comp, source:'draw', got, of, conf, at }
   ============================================================ */
(function(){
  var EV_KEY='bio004-evidence-v1';
  var p; try{p=new URLSearchParams(location.search);}catch(e){return;}
  var comp=p.get('comp')||'';
  if(!comp)return;                       /* plain scratch pad, panel stays off */
  var name=(p.get('title')||'this structure').replace(/[<>&]/g,'');
  var conf=p.get('conf')||'';

  var panel=document.getElementById('checkPanel');
  var btn=document.getElementById('checkBtn');
  if(!panel||!btn)return;
  btn.hidden=false;

  /* her worksheet checklist for this competency */
  var items=[],code='',dname='';
  var D=window.BIO004_DRAW||[];
  for(var i=0;i<D.length;i++){
    if((D[i].comps||[]).indexOf(comp)>=0&&D[i].items&&D[i].items.length){
      items=D[i].items;code=D[i].code||'';dname=D[i].name||'';break;
    }
  }

  var ticked={},scored=false;
  function esc(t){return String(t).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}

  function open(){
    panel.hidden=false;btn.textContent='Hide checklist';
    window.dispatchEvent(new Event('resize'));
    if(!conf)askConf(); else showList();
    var f=panel.querySelector('button');if(f)f.focus();
  }
  function close(){panel.hidden=true;btn.textContent='Check my work';window.dispatchEvent(new Event('resize'));}
  btn.addEventListener('click',function(){panel.hidden?open():close();});

  function askConf(){
    panel.innerHTML=
      '<p class="cp-eyebrow">Before you look</p>'+
      '<h2 class="cp-h">How well do you think you did?</h2>'+
      '<p class="cp-sub">Answer before the checklist appears. Being sure and being right are different things, and the gap between them is the useful part.</p>'+
      '<div class="cp-btns">'+
        '<button type="button" class="cp-b" data-c="low">Shaky</button>'+
        '<button type="button" class="cp-b" data-c="med">Fairly sure</button>'+
        '<button type="button" class="cp-b gold" data-c="high">Confident</button>'+
      '</div>';
    panel.querySelectorAll('[data-c]').forEach(function(b){
      b.addEventListener('click',function(){conf=b.getAttribute('data-c');showList();});
    });
  }

  function confLabel(){return {low:'Shaky',med:'Fairly sure',high:'Confident'}[conf]||'not recorded';}

  function showList(){
    var head=
      '<p class="cp-eyebrow">Compare against your drawing</p>'+
      '<h2 class="cp-h">'+(code?esc(code)+', ':'')+esc(dname||name)+'</h2>'+
      '<p class="cp-sub">Tick every item you actually drew. Be honest, this is your score. You went in: <strong>'+confLabel()+'</strong>.</p>';
    if(!items.length){
      panel.innerHTML=head+
        '<p class="cp-note">There is no checklist for this competency yet. Compare your drawing against your notes, the structure list, or the atlas, then score yourself.</p>'+
        gradeBlock();
      wireGrade();return;
    }
    panel.innerHTML=head+
      '<span class="cp-count" id="cpCount">0 of '+items.length+'</span>'+
      '<ul class="cp-list">'+items.map(function(x,n){
        return '<li><button type="button" class="cp-item" data-i="'+n+'" aria-pressed="false"><span class="cp-box" aria-hidden="true"></span><span>'+esc(x)+'</span></button></li>';
      }).join('')+'</ul>'+gradeBlock();
    panel.querySelectorAll('.cp-item').forEach(function(b){
      b.addEventListener('click',function(){
        var n=b.getAttribute('data-i');ticked[n]=!ticked[n];
        b.setAttribute('aria-pressed',ticked[n]?'true':'false');
        var got=Object.keys(ticked).filter(function(k){return ticked[k];}).length;
        var el=document.getElementById('cpCount');if(el)el.textContent=got+' of '+items.length;
      });
    });
    wireGrade();
  }

  function gradeBlock(){
    return '<hr class="cp-hr">'+
      '<p class="cp-eyebrow">Score it</p>'+
      '<h2 class="cp-h" style="font-size:16px">How complete were you?</h2>'+
      '<div class="cp-btns">'+
        '<button type="button" class="cp-b" data-got="2">Patchy</button>'+
        '<button type="button" class="cp-b" data-got="4">Solid</button>'+
        '<button type="button" class="cp-b gold" data-got="6">Thorough</button>'+
      '</div>'+
      '<p class="cp-msg" role="status" aria-live="polite"></p>'+
      '<hr class="cp-hr">'+
      '<p class="cp-eyebrow">Keep it</p>'+
      '<p class="cp-note">Happy with this one? <strong>Save PDF</strong> keeps a copy you can revise from, and <strong>Print</strong> gives you a paper version. Both are in the top bar, and neither includes this panel.</p>'+
      '<div class="cp-btns" style="margin-top:10px">'+
        '<button type="button" class="cp-b" id="cpPdf">Save PDF</button>'+
        '<button type="button" class="cp-b" id="cpPrint">Print drawing</button>'+
      '</div>';
  }

  function wireGrade(){
    panel.querySelectorAll('[data-got]').forEach(function(b){
      b.addEventListener('click',function(){record(parseInt(b.getAttribute('data-got'),10));});
    });
    var pdf=panel.querySelector('#cpPdf'),pr=panel.querySelector('#cpPrint');
    if(pdf)pdf.addEventListener('click',function(){var t=document.getElementById('savePdf');if(t)t.click();});
    if(pr)pr.addEventListener('click',function(){window.print();});
  }

  function record(got){
    if(scored)return;
    var log=[];
    try{log=JSON.parse(localStorage.getItem(EV_KEY)||'[]');if(!Array.isArray(log))log=[];}catch(e){log=[];}
    log.push({comp:comp,source:'draw',got:got,of:6,conf:conf||null,at:new Date().toISOString()});
    var msg=panel.querySelector('.cp-msg');
    try{localStorage.setItem(EV_KEY,JSON.stringify(log));}
    catch(e){if(msg){msg.style.color='var(--bad,#7A2E2E)';msg.textContent='Could not save. Your browser is blocking site storage for this page.';}return;}
    scored=true;
    panel.querySelectorAll('[data-got]').forEach(function(b){b.disabled=true;});
    if(!msg)return;
    if(conf==='high'&&got<=2){
      msg.textContent='Saved. You went in confident and came out patchy. That is the most useful thing you could have found today, and it puts this near the top of your weak spot board.';
    }else if(conf==='low'&&got>=6){
      msg.textContent='Saved. You knew that better than you thought. Trust yourself more on this one.';
    }else{
      msg.textContent='Saved. Mastery OS will show this the next time you open it.';
    }
  }
})();
</script>

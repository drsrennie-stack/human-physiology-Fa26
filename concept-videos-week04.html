<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIO 005 Human Physiology | The transport videos moved</title>
<meta name="description" content="The transport concept videos are now part of the single Week 2 concept video page.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/fonts-site.css">
<style>
  :root{--navy:#0B1530;--terra:#8B3A2E;--paper:#FAFAF9;--line:#D9DDE3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--navy);
       font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
       line-height:1.6}
  main{max-width:44rem;margin:0 auto;padding:3rem 1.25rem}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1.75rem 1.75rem;
        box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .eyebrow{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:.75rem;font-weight:800;
           letter-spacing:.18em;text-transform:uppercase;color:#6E2D24;margin:0 0 .5rem}
  h1{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:800;font-size:1.6rem;
     margin:0 0 .75rem;color:var(--navy)}
  p{margin:0 0 1rem}
  a.btn{display:inline-block;padding:.7rem 1.1rem;border-radius:6px;background:var(--terra);
        border:2px solid var(--terra);color:#fff;font-weight:700;text-decoration:none}
  a.btn:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="card">
    <p class="eyebrow">BIO 005 &middot; Week 2</p>
    <h1>The transport videos are on the Week 2 page now</h1>
    <p>All sixty three Week 2 videos live in one place: the cell and its organelles, then getting
      across the membrane, then cell signaling. You are being sent there now.</p>
    <p><a class="btn" id="go" href="concept-videos-week03.html" target="_top">Open the Week 2 concept videos</a></p>
  </div>
</main>
<script>
(function(){
  /* Transport used to be concepts 1 to 38 on this page. On the merged Week 2 page
     the eighteen cell videos come first, so an old ?c=N is now ?c=N+18.
     ?g= group slugs are unchanged. */
  var qs = location.search, out = "concept-videos-week03.html";
  var mc = /[?&]c=(\d{1,3})/.exec(qs);
  var mg = /[?&]g=([a-z0-9-]+)/i.exec(qs);
  if (mc) { out += "?c=" + (parseInt(mc[1], 10) + 18); }
  else if (mg) { out += "?g=" + mg[1]; }
  document.getElementById("go").setAttribute("href", out);
  location.replace(out);
})();
</script>
</body>
</html>
